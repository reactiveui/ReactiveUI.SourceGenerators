name: Diagnose devices

on:
    pull_request:
        paths:
            - '.github/workflows/diag-devices.yml'

permissions:
    contents: read

jobs:
    diag:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: reactiveui/ReactiveUI.Binding.SourceGenerators
                  ref: d1e1b65bca89e7cc1c1eb7d54f325fb0f337359d
                  path: old
            - uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
              with:
                  dotnet-versions: |
                      8.0.x
                      9.0.x
                      10.0.x
                      11.0.x
                  solution-file: ReactiveUI.SourceGenerators.Uno.slnf
                  install-workloads: 'true'
                  stamp-version: 'false'
            - name: Old repository, Uno library only
              shell: bash
              working-directory: old/src
              continue-on-error: true
              run: |
                  printf '{\n "solution": { "path": "ReactiveUI.Binding.SourceGenerators.slnx", "projects": [ "ReactiveUI.Binding.Uno\\\\ReactiveUI.Binding.Uno.csproj" ] }\n}\n' > diag-a.slnf
                  cat diag-a.slnf
                  dotnet test --solution diag-a.slnf --no-build -c Release
            - name: This repository, Uno library only
              shell: bash
              working-directory: src
              continue-on-error: true
              run: dotnet test --solution diag-a.slnf --no-build -c Release
