name: Diagnose devices

on:
    pull_request:
        paths:
            - '.github/workflows/diag-devices.yml'

permissions:
    contents: read

jobs:
    diag:
        strategy:
            fail-fast: false
            matrix:
                sdk: ['11.0.100-rc.2.26504.105', '11.0.x']
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
              with:
                  dotnet-versions: |
                      8.0.x
                      9.0.x
                      10.0.x
                      ${{ matrix.sdk }}
                  solution-file: ReactiveUI.SourceGenerators.Uno.slnf
                  install-workloads: 'true'
                  stamp-version: 'false'
            - name: Versions
              shell: bash
              working-directory: src
              run: dotnet --list-sdks
            - name: Pin the SDK
              if: matrix.sdk != '11.0.x'
              shell: bash
              working-directory: src
              run: |
                  printf '{\n "sdk": { "version": "%s", "rollForward": "disable", "allowPrerelease": true },\n "test": { "runner": "Microsoft.Testing.Platform" },\n "msbuild-sdks": { "Uno.Sdk": "6.7.30" }\n}\n' "${{ matrix.sdk }}" > global.json
                  dotnet --version
            - name: Uno library only
              shell: bash
              working-directory: src
              continue-on-error: true
              run: dotnet test --solution diag-a.slnf --no-build -c Release
