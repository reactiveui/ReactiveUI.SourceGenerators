name: Diagnose devices

on:
    pull_request:
        paths:
            - '.github/workflows/diag-devices.yml'

permissions:
    contents: read

jobs:
    diag:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
              with:
                  dotnet-versions: |
                      8.0.x
                      9.0.x
                      10.0.x
                      11.0.x
                  solution-file: ReactiveUI.SourceGenerators.Uno.slnf
                  install-workloads: 'true'
                  stamp-version: 'false'
            - name: Per target framework
              shell: bash
              working-directory: src
              continue-on-error: true
              run: |
                  for tfm in net10.0 net11.0 net10.0-android36.0 net11.0-android37 net10.0-ios net11.0-ios net10.0-maccatalyst net10.0-windows10.0.19041.0; do
                    echo "=== $tfm"
                    dotnet msbuild ReactiveUI.Binding.Uno/ReactiveUI.Binding.Uno.csproj -p:TargetFramework=$tfm -getProperty:AndroidApplication,OutputType,UnoSingleProject,TestingPlatformDotnetTestSupport,IsTestingPlatformApplication || true
                    dotnet test --project ReactiveUI.Binding.Uno/ReactiveUI.Binding.Uno.csproj --framework $tfm --no-build -c Release || true
                  done
